<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,monospace">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F0F6FC"/>
      <stop offset=".6" stop-color="#79C0FF"/>
      <stop offset="1" stop-color="#58A6FF"/>
    </linearGradient>
    <clipPath id="frame"><rect x="1" y="1" width="998" height="318" rx="16"/></clipPath>
  </defs>
  <style>
    .t { fill: #8B949E; font-size: 13px; }
    .ok { fill: #3FB950; }
    .ln { opacity: 0; animation: type .01s steps(1) forwards; }
    .l1 { animation-delay: .3s; } .l2 { animation-delay: .8s; }
    .l3 { animation-delay: 1.3s; } .l4 { animation-delay: 1.8s; }
    .l5 { animation-delay: 2.4s; }
    .name { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) 2.6s forwards; }
    .sub  { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) 2.9s forwards; }
    .caret { animation: blink 1.05s step-end infinite; }
    .grid line { stroke: #161B22; }
    .orbitA { animation: spin 14s linear infinite; transform-origin: 845px 160px; }
    .orbitB { animation: spinR 22s linear infinite; transform-origin: 845px 160px; }
    .core { animation: breathe 3s ease-in-out infinite; transform-origin: 845px 160px; transform-box: view-box; }
    .beam { animation: sweep 7s linear infinite; }
    @keyframes type { to { opacity: 1; } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes spinR { to { transform: rotate(-360deg); } }
    @keyframes breathe { 0%,100% { opacity: .9; } 50% { opacity: .45; } }
    @keyframes sweep { 0% { transform: translateX(-140px); } 100% { transform: translateX(1140px); } }
  </style>

  <rect x="1" y="1" width="998" height="318" rx="16" fill="#0D1117" stroke="#30363D"/>

  <!-- faint blueprint grid -->
  <g class="grid" opacity=".55" clip-path="url(#frame)">
    <line x1="0" y1="80" x2="1000" y2="80"/><line x1="0" y1="160" x2="1000" y2="160"/><line x1="0" y1="240" x2="1000" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="320"/><line x1="400" y1="0" x2="400" y2="320"/><line x1="600" y1="0" x2="600" y2="320"/><line x1="800" y1="0" x2="800" y2="320"/>
  </g>

  <!-- window chrome -->
  <circle cx="34" cy="30" r="5.5" fill="#F85149" opacity=".85"/>
  <circle cx="54" cy="30" r="5.5" fill="#D29922" opacity=".85"/>
  <circle cx="74" cy="30" r="5.5" fill="#3FB950" opacity=".85"/>
  <text x="500" y="34" text-anchor="middle" font-size="12" fill="#484F58" letter-spacing="2">huy@github : ~/init</text>
  <line x1="1" y1="48" x2="999" y2="48" stroke="#21262D"/>

  <!-- boot log -->
  <g clip-path="url(#frame)">
    <text x="36" y="82"  class="t ln l1"><tspan fill="#484F58">$</tspan> ./bootstrap --profile hutt1212</text>
    <text x="36" y="106" class="t ln l2"><tspan class="ok">✔</tspan> backend.core ......... <tspan fill="#79C0FF">node · .net · graphql</tspan></text>
    <text x="36" y="130" class="t ln l3"><tspan class="ok">✔</tspan> realtime.layer ....... <tspan fill="#79C0FF">signalr · websocket</tspan></text>
    <text x="36" y="154" class="t ln l4"><tspan class="ok">✔</tspan> ai.agent ............. <tspan fill="#79C0FF">rag · multimodal</tspan></text>
    <text x="36" y="178" class="t ln l5"><tspan fill="#D29922">➜</tspan> identity loaded<tspan fill="#58A6FF" class="caret"> ▍</tspan></text>
  </g>

  <!-- identity -->
  <g class="name">
    <text x="36" y="242" font-size="44" font-weight="800" letter-spacing="1" fill="url(#nameGrad)">NGUYEN MINH HUY</text>
  </g>
  <g class="sub">
    <rect x="36" y="262" width="10" height="20" fill="#58A6FF"/>
    <text x="56" y="278" font-size="15" font-weight="600" fill="#C9D1D9" letter-spacing="4">FULLSTACK DEVELOPER — WEB × REALTIME × AI</text>
  </g>

  <!-- orbital system, right side -->
  <g clip-path="url(#frame)">
    <g opacity=".9">
      <circle cx="845" cy="160" r="86" fill="none" stroke="#21262D"/>
      <circle cx="845" cy="160" r="55" fill="none" stroke="#21262D"/>
      <g class="orbitA">
        <circle cx="845" cy="74" r="5" fill="#58A6FF"/>
        <circle cx="845" cy="246" r="3.5" fill="#3FB950"/>
      </g>
      <g class="orbitB">
        <circle cx="790" cy="160" r="4" fill="#D29922"/>
        <circle cx="900" cy="160" r="3" fill="#F85149"/>
      </g>
      <circle cx="845" cy="160" r="14" fill="#0D1117" stroke="#58A6FF" stroke-width="1.5" class="core"/>
      <circle cx="845" cy="160" r="5" fill="#58A6FF" class="core"/>
    </g>
  </g>

  <!-- sweeping light on bottom edge -->
  <g clip-path="url(#frame)">
    <rect x="0" y="317" width="140" height="2" fill="url(#edge)" class="beam"/>
  </g>
</svg>
