<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 372" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,monospace">
  <style>
    .card { opacity: 0; animation: fadeUp .7s ease-out forwards; }
    .c1 { animation-delay: .05s; } .c2 { animation-delay: .2s; } .c3 { animation-delay: .35s; }
    .c4 { animation-delay: .5s; } .c5 { animation-delay: .65s; } .c6 { animation-delay: .8s; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .title { font-size: 13px; font-weight: 700; fill: #58A6FF; letter-spacing: 2px; }
    .idx { font-size: 11px; fill: #30363D; font-weight: 700; }
    .item { font-size: 12.5px; fill: #C9D1D9; }
    .dim { fill: #8B949E; }
    .panel { fill: #161B22; stroke: #30363D; }
  </style>

  <rect x="1" y="1" width="998" height="370" rx="14" fill="#0D1117" stroke="#30363D"/>
  <text x="32" y="40" font-size="13" fill="#8B949E" letter-spacing="2">// TOOLKIT.MATRIX</text>
  <line x1="32" y1="56" x2="968" y2="56" stroke="#21262D"/>

  <!-- row 1 -->
  <g class="card c1">
    <rect x="32" y="76" width="296" height="128" rx="10" class="panel"/>
    <text x="52" y="106" class="title">FRONTEND</text>
    <text x="296" y="106" class="idx">01</text>
    <text x="52" y="134" class="item">Next.js · React · TypeScript</text>
    <text x="52" y="156" class="item">Tailwind CSS · Framer Motion</text>
    <text x="52" y="178" class="item dim">SSR / SSG · Core Web Vitals</text>
  </g>
  <g class="card c2">
    <rect x="352" y="76" width="296" height="128" rx="10" class="panel"/>
    <text x="372" y="106" class="title">BACKEND</text>
    <text x="616" y="106" class="idx">02</text>
    <text x="372" y="134" class="item">Node.js · Express · .NET</text>
    <text x="372" y="156" class="item">REST · GraphQL</text>
    <text x="372" y="178" class="item dim">OAuth2 · JWT · OWASP-aware</text>
  </g>
  <g class="card c3">
    <rect x="672" y="76" width="296" height="128" rx="10" class="panel"/>
    <text x="692" y="106" class="title">REALTIME &amp; AI</text>
    <text x="936" y="106" class="idx">03</text>
    <text x="692" y="134" class="item">SignalR · WebSocket · SSE</text>
    <text x="692" y="156" class="item">AI Agents · RAG · Multimodal</text>
    <text x="692" y="178" class="item dim">Queueing · Multi-tier alerts</text>
  </g>

  <!-- row 2 -->
  <g class="card c4">
    <rect x="32" y="224" width="296" height="128" rx="10" class="panel"/>
    <text x="52" y="254" class="title">DATA</text>
    <text x="296" y="254" class="idx">04</text>
    <text x="52" y="282" class="item">PostgreSQL · MongoDB</text>
    <text x="52" y="304" class="item">Redis</text>
    <text x="52" y="326" class="item dim">Caching · Query optimization</text>
  </g>
  <g class="card c5">
    <rect x="352" y="224" width="296" height="128" rx="10" class="panel"/>
    <text x="372" y="254" class="title">DEVOPS</text>
    <text x="616" y="254" class="idx">05</text>
    <text x="372" y="282" class="item">Docker · GitHub Actions</text>
    <text x="372" y="304" class="item">Vercel · CI/CD pipelines</text>
    <text x="372" y="326" class="item dim">Git flow · Code review</text>
  </g>
  <g class="card c6">
    <rect x="672" y="224" width="296" height="128" rx="10" class="panel"/>
    <text x="692" y="254" class="title">QUALITY</text>
    <text x="936" y="254" class="idx">06</text>
    <text x="692" y="282" class="item">Lighthouse 95+ targets</text>
    <text x="692" y="304" class="item">i18n · Accessibility</text>
    <text x="692" y="326" class="item dim">Performance budgets</text>
  </g>
</svg>
