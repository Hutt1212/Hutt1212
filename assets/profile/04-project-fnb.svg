<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,monospace">
  <style>
    .fade { opacity: 0; animation: up .7s ease-out forwards; }
    .d1{animation-delay:.1s}.d2{animation-delay:.25s}.d3{animation-delay:.4s}.d4{animation-delay:.55s}.d5{animation-delay:.7s}
    .flow { stroke-dasharray: 6 8; animation: dash 1.4s linear infinite; }
    .pulse { animation: pulse 2.2s ease-in-out infinite; }
    @keyframes up { from { opacity:0; transform: translateY(8px);} to { opacity:1; transform: translateY(0);} }
    @keyframes dash { to { stroke-dashoffset: -14; } }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .k { fill:#8B949E; font-size:11.5px; letter-spacing:1px; }
    .v { fill:#C9D1D9; font-size:12.5px; }
    .node { fill:#161B22; stroke:#30363D; }
    .nlabel { fill:#C9D1D9; font-size:12px; text-anchor:middle; }
    .nsub { fill:#8B949E; font-size:10px; text-anchor:middle; }
    .metric { fill:#F0F6FC; font-size:26px; font-weight:700; }
  </style>

  <rect x="1" y="1" width="998" height="338" rx="14" fill="#0D1117" stroke="#30363D"/>

  <!-- header -->
  <text x="32" y="40" font-size="12" fill="#8B949E" letter-spacing="2" class="fade d1">FEATURED PROJECT · PRIVATE REPOSITORY</text>
  <g class="fade d1">
    <rect x="806" y="24" width="162" height="24" rx="12" fill="#161B22" stroke="#30363D"/>
    <circle cx="822" cy="36" r="4" fill="#D29922" class="pulse"/>
    <text x="834" y="40" font-size="11" fill="#D29922" letter-spacing="1">PRODUCTION</text>
  </g>
  <text x="32" y="74" font-size="21" font-weight="700" fill="#F0F6FC" class="fade d2">AI-Powered Digital Platform — F&amp;B Industry</text>
  <text x="32" y="98" font-size="13" fill="#8B949E" class="fade d2">Brand site · multi-channel support · realtime ops dashboard — owned frontend, APIs, AI &amp; realtime layer</text>
  <line x1="32" y1="116" x2="968" y2="116" stroke="#21262D"/>

  <!-- architecture flow -->
  <g class="fade d3">
    <rect x="46"  y="150" width="130" height="52" rx="8" class="node"/>
    <text x="111" y="172" class="nlabel">Next.js UI</text>
    <text x="111" y="188" class="nsub">bento · pagespeed &gt; 90</text>

    <rect x="246" y="150" width="130" height="52" rx="8" class="node"/>
    <text x="311" y="172" class="nlabel">Node.js API</text>
    <text x="311" y="188" class="nsub">rest · business logic</text>

    <rect x="446" y="122" width="130" height="52" rx="8" class="node"/>
    <text x="511" y="144" class="nlabel">SignalR Hub</text>
    <text x="511" y="160" class="nsub">queue · presence</text>

    <rect x="446" y="186" width="130" height="52" rx="8" class="node"/>
    <text x="511" y="208" class="nlabel">AI Agent</text>
    <text x="511" y="224" class="nsub">rag · multimodal · ocr</text>

    <rect x="646" y="150" width="130" height="52" rx="8" class="node"/>
    <text x="711" y="172" class="nlabel">Data Layer</text>
    <text x="711" y="188" class="nsub">mongodb · redis</text>

    <rect x="838" y="150" width="130" height="52" rx="8" class="node"/>
    <text x="903" y="172" class="nlabel">Notify</text>
    <text x="903" y="188" class="nsub">telegram · email</text>

    <path d="M176 176 H246" fill="none" stroke="#58A6FF" stroke-width="1.5" class="flow"/>
    <path d="M376 176 C410 176 415 148 446 148" fill="none" stroke="#58A6FF" stroke-width="1.5" class="flow"/>
    <path d="M376 176 C410 176 415 212 446 212" fill="none" stroke="#58A6FF" stroke-width="1.5" class="flow"/>
    <path d="M576 148 C610 148 615 176 646 176" fill="none" stroke="#58A6FF" stroke-width="1.5" class="flow"/>
    <path d="M576 212 C610 212 615 176 646 176" fill="none" stroke="#58A6FF" stroke-width="1.5" class="flow"/>
    <path d="M776 176 H838" fill="none" stroke="#58A6FF" stroke-width="1.5" class="flow"/>
  </g>

  <line x1="32" y1="262" x2="968" y2="262" stroke="#21262D"/>

  <!-- impact metrics -->
  <g class="fade d4">
    <text x="46" y="302" class="metric">~70<tspan font-size="15" fill="#3FB950">%</tspan></text>
    <text x="46" y="322" class="k">REQUESTS AUTOMATED</text>
  </g>
  <g class="fade d4">
    <text x="306" y="302" class="metric">min <tspan fill="#58A6FF">→</tspan> sec</text>
    <text x="306" y="322" class="k">RESPONSE TIME</text>
  </g>
  <g class="fade d5">
    <text x="566" y="302" class="metric">multi<tspan font-size="15" fill="#79C0FF">-lang</tspan></text>
    <text x="566" y="322" class="k">LANGUAGE BARRIER REMOVED</text>
  </g>
  <g class="fade d5">
    <text x="806" y="302" class="metric">&gt; 90</text>
    <text x="806" y="322" class="k">PAGESPEED · ALL DEVICES</text>
  </g>
</svg>
