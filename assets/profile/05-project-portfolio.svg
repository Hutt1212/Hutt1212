<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,monospace">
  <style>
    .fade { opacity: 0; animation: up .7s ease-out forwards; }
    .d1{animation-delay:.1s}.d2{animation-delay:.25s}.d3{animation-delay:.4s}.d4{animation-delay:.6s}
    .bar { transform: scaleX(0); transform-origin: left; animation: grow 1.1s cubic-bezier(.2,.7,.2,1) forwards; }
    .b1{animation-delay:.5s}.b2{animation-delay:.65s}.b3{animation-delay:.8s}.b4{animation-delay:.95s}
    .tile { animation: shimmer 3.2s ease-in-out infinite; }
    .t2{animation-delay:.5s}.t3{animation-delay:1s}.t4{animation-delay:1.5s}.t5{animation-delay:2s}
    @keyframes up { from { opacity:0; transform: translateY(8px);} to { opacity:1; transform: translateY(0);} }
    @keyframes grow { to { transform: scaleX(1); } }
    @keyframes shimmer { 0%,100%{stroke:#30363D} 50%{stroke:#58A6FF} }
    .k { fill:#8B949E; font-size:11.5px; letter-spacing:1px; }
    .score { fill:#3FB950; font-size:13px; font-weight:700; }
  </style>

  <rect x="1" y="1" width="998" height="298" rx="14" fill="#0D1117" stroke="#30363D"/>

  <text x="32" y="40" font-size="12" fill="#8B949E" letter-spacing="2" class="fade d1">// SYSTEM.02 — LIVE</text>
  <g class="fade d1">
    <rect x="868" y="24" width="100" height="24" rx="12" fill="#161B22" stroke="#238636"/>
    <circle cx="884" cy="36" r="4" fill="#3FB950"/>
    <text x="896" y="40" font-size="11" fill="#3FB950" letter-spacing="1">ONLINE</text>
  </g>
  <text x="32" y="74" font-size="21" font-weight="700" fill="#F0F6FC" class="fade d2">Personal Portfolio — Bento Grid</text>
  <text x="32" y="98" font-size="13" fill="#8B949E" class="fade d2">Designed &amp; built end-to-end · EN ⇄ VI instant i18n · Framer Motion micro-interactions · deployed on Vercel</text>
  <line x1="32" y1="116" x2="968" y2="116" stroke="#21262D"/>

  <!-- mini bento mock -->
  <g class="fade d3">
    <rect x="46"  y="140" width="150" height="120" rx="8" fill="#161B22" stroke="#30363D" class="tile"/>
    <rect x="208" y="140" width="90"  height="56"  rx="8" fill="#161B22" stroke="#30363D" class="tile t2"/>
    <rect x="208" y="204" width="90"  height="56"  rx="8" fill="#161B22" stroke="#30363D" class="tile t3"/>
    <rect x="310" y="140" width="110" height="56"  rx="8" fill="#161B22" stroke="#30363D" class="tile t4"/>
    <rect x="310" y="204" width="110" height="56"  rx="8" fill="#161B22" stroke="#30363D" class="tile t5"/>
    <circle cx="80" cy="172" r="12" fill="#21262D" stroke="#58A6FF"/>
    <rect x="62" y="200" width="90" height="6" rx="3" fill="#21262D"/>
    <rect x="62" y="214" width="118" height="6" rx="3" fill="#21262D"/>
    <rect x="62" y="228" width="70" height="6" rx="3" fill="#21262D"/>
  </g>

  <!-- lighthouse bars -->
  <g class="fade d3">
    <text x="490" y="152" class="k">PERFORMANCE</text>
    <rect x="640" y="142" width="240" height="8" rx="4" fill="#21262D"/>
    <rect x="640" y="142" width="240" height="8" rx="4" fill="#3FB950" class="bar b1"/>
    <text x="892" y="152" class="score">100</text>

    <text x="490" y="184" class="k">ACCESSIBILITY</text>
    <rect x="640" y="174" width="240" height="8" rx="4" fill="#21262D"/>
    <rect x="640" y="174" width="230" height="8" rx="4" fill="#3FB950" class="bar b2"/>
    <text x="892" y="184" class="score">96</text>

    <text x="490" y="216" class="k">BEST PRACTICES</text>
    <rect x="640" y="206" width="240" height="8" rx="4" fill="#21262D"/>
    <rect x="640" y="206" width="240" height="8" rx="4" fill="#3FB950" class="bar b3"/>
    <text x="892" y="216" class="score">100</text>

    <text x="490" y="248" class="k">LCP · STATIC GENERATION</text>
    <rect x="640" y="238" width="240" height="8" rx="4" fill="#21262D"/>
    <rect x="640" y="238" width="212" height="8" rx="4" fill="#58A6FF" class="bar b4"/>
    <text x="892" y="248" class="score" fill="#58A6FF">0.8s</text>
  </g>

  <text x="46" y="284" font-size="11.5" fill="#484F58" class="fade d4">next.js · typescript · tailwind · framer-motion — nguyenminhhuy-portfolio.vercel.app</text>
</svg>
