<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" font-family="'Segoe UI','Inter',-apple-system,'Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F0F6FC"/>
      <stop offset=".7" stop-color="#79C0FF"/>
      <stop offset="1" stop-color="#58A6FF"/>
    </linearGradient>
    <clipPath id="frame"><rect x="1" y="1" width="998" height="278" rx="16"/></clipPath>
  </defs>
  <style>
    .name { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) .2s forwards; }
    .sub  { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) .5s forwards; }
    .tag  { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) .8s forwards; }
    .chips{ opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) 1.1s forwards; }
    .orbitA { animation: spin 16s linear infinite; transform-origin: 840px 140px; }
    .orbitB { animation: spinR 26s linear infinite; transform-origin: 840px 140px; }
    .core { animation: breathe 3.5s ease-in-out infinite; }
    .beam { animation: sweep 8s linear infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes spinR { to { transform: rotate(-360deg); } }
    @keyframes breathe { 0%,100% { opacity: .9; } 50% { opacity: .5; } }
    @keyframes sweep { 0% { transform: translateX(-140px); } 100% { transform: translateX(1140px); } }
    .chip { fill:#161B22; stroke:#30363D; }
    .chipText { fill:#8B949E; font-size:12.5px; letter-spacing:.5px; }
  </style>

  <rect x="1" y="1" width="998" height="278" rx="16" fill="#0D1117" stroke="#30363D"/>

  <!-- subtle grid -->
  <g opacity=".5" clip-path="url(#frame)">
    <line x1="0" y1="93" x2="1000" y2="93" stroke="#161B22"/>
    <line x1="0" y1="186" x2="1000" y2="186" stroke="#161B22"/>
    <line x1="250" y1="0" x2="250" y2="280" stroke="#161B22"/>
    <line x1="500" y1="0" x2="500" y2="280" stroke="#161B22"/>
    <line x1="750" y1="0" x2="750" y2="280" stroke="#161B22"/>
  </g>

  <!-- identity -->
  <g class="name">
    <text x="48" y="112" font-size="46" font-weight="700" letter-spacing=".5" fill="url(#nameGrad)">Nguyen Minh Huy</text>
  </g>
  <g class="sub">
    <rect x="48" y="132" width="42" height="4" rx="2" fill="#58A6FF"/>
    <text x="48" y="168" font-size="17" font-weight="600" fill="#C9D1D9" letter-spacing="2">FULLSTACK DEVELOPER</text>
  </g>
  <g class="tag">
    <text x="48" y="198" font-size="14" fill="#8B949E">Building end-to-end web products — solid backends, realtime systems, applied AI.</text>
  </g>

  <!-- focus chips -->
  <g class="chips">
    <rect x="48" y="220" width="118" height="30" rx="15" class="chip"/>
    <text x="70" y="240" class="chipText">Web Apps</text>
    <rect x="178" y="220" width="150" height="30" rx="15" class="chip"/>
    <text x="200" y="240" class="chipText">Realtime Systems</text>
    <rect x="340" y="220" width="118" height="30" rx="15" class="chip"/>
    <text x="362" y="240" class="chipText">AI &amp; RAG</text>
  </g>

  <!-- orbital accent, right side -->
  <g clip-path="url(#frame)" opacity=".85">
    <circle cx="840" cy="140" r="84" fill="none" stroke="#21262D"/>
    <circle cx="840" cy="140" r="52" fill="none" stroke="#21262D"/>
    <g class="orbitA">
      <circle cx="840" cy="56" r="5" fill="#58A6FF"/>
      <circle cx="840" cy="224" r="3.5" fill="#3FB950"/>
    </g>
    <g class="orbitB">
      <circle cx="788" cy="140" r="4" fill="#D29922"/>
      <circle cx="892" cy="140" r="3" fill="#79C0FF"/>
    </g>
    <circle cx="840" cy="140" r="13" fill="#0D1117" stroke="#58A6FF" stroke-width="1.5" class="core"/>
    <circle cx="840" cy="140" r="4.5" fill="#58A6FF" class="core"/>
  </g>

  <g clip-path="url(#frame)">
    <rect x="0" y="277" width="140" height="2" fill="url(#edge)" class="beam"/>
  </g>
</svg>
