<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,monospace">
  <style>
    .fade { opacity: 0; animation: fadeUp .8s ease-out forwards; }
    .d1 { animation-delay: .1s; } .d2 { animation-delay: .25s; }
    .d3 { animation-delay: .4s; } .d4 { animation-delay: .55s; }
    .d5 { animation-delay: .7s; } .d6 { animation-delay: .85s; }
    .pulse { animation: pulse 2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    .blink { animation: blink 1.1s step-end infinite; }
    .scan { animation: scan 6s linear infinite; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .45; transform: scale(.8); } }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes scan { 0% { transform: translateX(0); } 100% { transform: translateX(936px); } }
    .key { fill: #8B949E; font-size: 12px; letter-spacing: 1px; }
    .val { fill: #C9D1D9; font-size: 13px; }
  </style>

  <rect x="1" y="1" width="998" height="298" rx="14" fill="#0D1117" stroke="#30363D"/>

  <!-- header strip -->
  <text x="32" y="42" font-size="13" fill="#8B949E" letter-spacing="2" class="fade d1">// PROFILE.DOSSIER</text>
  <g class="fade d1">
    <circle cx="770" cy="37" r="5" fill="#3FB950" class="pulse"/>
    <text x="784" y="42" font-size="12" fill="#3FB950" letter-spacing="1">OPEN TO OPPORTUNITIES</text>
  </g>
  <line x1="32" y1="60" x2="968" y2="60" stroke="#21262D" stroke-width="1"/>
  <rect y="59" width="32" height="2" fill="#58A6FF" opacity=".7" class="scan"/>

  <!-- identity -->
  <text x="32" y="122" font-size="34" font-weight="700" fill="#F0F6FC" letter-spacing="1" class="fade d2">NGUYEN MINH HUY</text>
  <g class="fade d3">
    <text x="32" y="156" font-size="17" font-weight="600" fill="#58A6FF" letter-spacing="3">FULLSTACK DEVELOPER</text>
    <text x="292" y="156" font-size="17" fill="#58A6FF" class="blink">_</text>
  </g>
  <text x="32" y="192" font-size="13.5" fill="#8B949E" class="fade d4">End-to-end web systems — solid backend architecture,</text>
  <text x="32" y="214" font-size="13.5" fill="#8B949E" class="fade d4">realtime pipelines, and interfaces that feel effortless.</text>

  <g class="fade d5">
    <text x="32" y="262" font-size="12" fill="#8B949E" letter-spacing="1">SYS.STATUS</text>
    <text x="122" y="262" font-size="12" fill="#79C0FF" letter-spacing="1">▸ SHIPPING&#8201;: web × realtime × AI</text>
  </g>

  <!-- divider -->
  <line x1="600" y1="84" x2="600" y2="272" stroke="#21262D" stroke-width="1"/>

  <!-- facts panel -->
  <g class="fade d3">
    <text x="632" y="112" class="key">LOCATION</text>
    <text x="632" y="132" class="val">Vietnam · UTC+7</text>
  </g>
  <g class="fade d4">
    <text x="632" y="164" class="key">CORE</text>
    <text x="632" y="184" class="val">TypeScript · Node.js · .NET</text>
  </g>
  <g class="fade d5">
    <text x="632" y="216" class="key">DOMAINS</text>
    <text x="632" y="236" class="val">Web · Realtime · AI (RAG)</text>
  </g>
  <g class="fade d6">
    <text x="632" y="268" class="key">DELIVERY</text>
    <text x="632" y="288" class="val" font-size="12.5">Docker · CI/CD · Vercel</text>
  </g>
</svg>
